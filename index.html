<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">

<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Commitment Board</title>

<style>
/* Layout: one column, max 1040px. Sign-off status first, then the coordinator's box, then one tinted box per person in two columns that stack on phones. */
:root{
  color-scheme:light dark;
  --bg:#FFFFFF; --surface:#F5F5F7; --field:#FFFFFF; --fill:rgba(118,118,128,.12); --fill-soft:rgba(118,118,128,.08);
  --fg:#1D1D1F; --fg-2:#6A6A70; --line:rgba(60,60,67,.14);
  --t0:#EBF4FF; --t1:#EEF9FB; --t2:#F9F1FC; --t3:#F6F3EF; --t4:#F2F1FC; --t5:#FFEEF1; --t6:#FFFAE6;
  --accent:#0071E3; --accent-ink:#0066CC; --accent-fg:#FFFFFF; --seg-on:#FFFFFF;
  --good:#176B2C; --good-soft:rgba(52,199,89,.16); --good-dot:#34C759;
  --warn:#8F4700; --warn-soft:rgba(255,149,0,.16); --warn-dot:#FF9500;
  --bad:#C20014; --bad-soft:rgba(255,59,48,.12);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;
  --font-sign:"Snell Roundhand","Apple Chancery","Segoe Script","Brush Script MT",cursive;
  --font-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000; --surface:#1C1C1E; --field:#2C2C2E; --fill:rgba(118,118,128,.24); --fill-soft:rgba(118,118,128,.16);
    --fg:#F5F5F7; --fg-2:#A1A1A6; --line:rgba(84,84,88,.6);
    --t0:#192D42; --t1:#22383D; --t2:#362640; --t3:#39332D; --t4:#282842; --t5:#3C2027; --t6:#37321C;
    --accent:#0A84FF; --accent-ink:#409CFF; --accent-fg:#FFFFFF; --seg-on:#636366;
    --good:#30D158; --good-soft:rgba(48,209,88,.18); --good-dot:#30D158;
    --warn:#FF9F0A; --warn-soft:rgba(255,159,10,.18); --warn-dot:#FF9F0A;
    --bad:#FF453A; --bad-soft:rgba(255,69,58,.18);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.wrap{max-width:1040px;margin:0 auto;padding:28px 20px 48px;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::placeholder{color:var(--fg-2);opacity:.7}
p,h1,h2,ul{margin:0}
ul{padding:0;list-style:none}
[hidden]{display:none!important}

.top{display:flex;flex-direction:column;gap:4px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-2)}
.title{font:700 28px/1.15 var(--font);letter-spacing:-.02em;color:var(--fg)}
textarea.title{width:100%;border:0;background:transparent;resize:none;overflow:hidden;padding:2px 6px;margin-left:-6px;border-radius:8px}
textarea.title:hover,textarea.title:focus{background:var(--fill-soft)}

.who{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.who-label{font-size:13px;font-weight:500;color:var(--fg-2)}
.seg{display:flex;gap:2px;max-width:100%;overflow-x:auto;background:var(--fill);padding:2px;border-radius:10px;scrollbar-width:none}
.seg button{flex:none;border:0;background:transparent;font-size:13px;font-weight:500;padding:6px 12px;border-radius:8px;white-space:nowrap;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--seg-on);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.hint{flex-basis:100%;font-size:13.5px;color:var(--fg-2)}
.hint b{color:var(--fg);font-weight:600}

.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px;padding:10px 14px;border-radius:12px;background:var(--warn-soft);font-size:13.5px}
.banner.bad{background:var(--bad-soft)}

.card{background:var(--card,var(--surface));border-radius:var(--r)}
.t0{--card:var(--t0)}.t1{--card:var(--t1)}.t2{--card:var(--t2)}.t3{--card:var(--t3)}.t4{--card:var(--t4)}.t5{--card:var(--t5)}.t6{--card:var(--t6)}
.pad{padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.pad h2{font-size:17px;font-weight:600}
.pad p{max-width:62ch}
.status{padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.status-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.status h2{font-size:20px;font-weight:700;letter-spacing:-.01em}
.next{font-size:14px;color:var(--fg-2)}
.next b{color:var(--fg);font-weight:600}
.tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding-top:4px}
.chip{display:flex;align-items:center;gap:7px;min-width:0;padding:6px 12px 6px 10px;border-radius:999px;background:var(--fill-soft);font-size:13px}
.chip i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--fg-2);opacity:.45}
.chip.signed i{background:var(--good-dot);opacity:1}
.chip.stale i{background:var(--warn-dot);opacity:1}
.chip b{font-weight:600;overflow-wrap:anywhere}
.chip span{color:var(--fg-2)}
.chip.signed span{color:var(--good)}
.chip.stale span{color:var(--warn)}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.grid>:last-child:nth-child(odd){grid-column:1/-1}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}

.person{display:flex;flex-direction:column;min-width:0}
.p-head{display:flex;align-items:flex-start;gap:12px;padding:16px 18px 12px}
.p-id{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.p-name{font-size:17px;font-weight:600;letter-spacing:-.01em;overflow-wrap:anywhere}
.p-role{font-size:13px;color:var(--fg-2);overflow-wrap:anywhere}
.you{font-style:normal;font-size:12px;font-weight:600;color:var(--accent-ink);margin-left:6px}
.in{font-family:inherit;color:inherit;border:0;background:transparent;padding:2px 6px;margin-left:-6px;border-radius:7px;width:100%;min-width:0}
.in:hover,.in:focus{background:var(--fill-soft)}
.pill{flex:none;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--fill);color:var(--fg-2);white-space:nowrap}
.pill.signed{background:var(--good-soft);color:var(--good)}
.pill.stale{background:var(--warn-soft);color:var(--warn)}

.tasks{padding:0 18px;display:flex;flex-direction:column}
.task{display:grid;grid-template-columns:22px minmax(0,1fr) auto;column-gap:10px;row-gap:4px;padding:10px 0;border-top:1px solid var(--line)}
.check{grid-column:1;grid-row:1;margin-top:5px;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--fg-2);background:transparent;padding:0;display:grid;place-items:center}
button.check{cursor:pointer}
.check.on,.check[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.check.on::after,.check[aria-pressed="true"]::after{content:"";width:10px;height:6px;border-left:2px solid var(--accent-fg);border-bottom:2px solid var(--accent-fg);transform:translateY(-1px) rotate(-45deg)}
.t-title{grid-column:2;grid-row:1;font:inherit;color:inherit;line-height:1.35;padding:5px 6px;min-width:0;overflow-wrap:anywhere}
textarea.t-title{width:100%;border:0;background:transparent;resize:none;overflow:hidden;border-radius:7px;min-height:30px}
textarea.t-title:hover,textarea.t-title:focus{background:var(--fill-soft)}
.task.done .t-title{color:var(--fg-2);text-decoration:line-through}
.x{grid-column:3;grid-row:1;width:26px;height:26px;margin-top:3px;border:0;border-radius:50%;background:transparent;color:var(--fg-2);font-size:18px;line-height:1;cursor:pointer}
.x:hover{background:var(--fill)}
.when{grid-column:2/-1;grid-row:2;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding-left:6px;font-size:13px;color:var(--fg-2)}
.t-date{font-variant-numeric:tabular-nums;font-weight:600;color:var(--fg)}
input.t-date{font:inherit;font-size:14px;font-weight:500;border:0;background:var(--fill);border-radius:8px;padding:5px 8px;min-height:30px;max-width:100%}
.task.overdue .t-date{color:var(--bad)}
.task.done .t-date{color:var(--fg-2);font-weight:500}
.when .bad{color:var(--bad);font-weight:600}
.when .warn{color:var(--warn);font-weight:600}
.none{padding:4px 18px 14px;font-size:14px;color:var(--fg-2)}
.add{align-self:flex-start;margin:2px 12px 10px;border:0;background:transparent;color:var(--accent-ink);font-weight:600;padding:8px 6px;border-radius:8px;cursor:pointer}
.add::before{content:"+ "}

.p-foot{padding:14px 18px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.sign{width:100%;display:flex;flex-direction:column;gap:10px}
.pledge,.note{font-size:13px;color:var(--fg-2)}
.note.warn,.pledge.warn{color:var(--warn)}
.sign-row{display:flex;flex-wrap:wrap;gap:8px}
.sign-name{flex:1 1 180px;min-width:0;font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--fg)}
.btn{font-weight:600;border:0;border-radius:10px;padding:9px 16px;cursor:pointer}
a.btn{text-decoration:none;display:inline-block}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.primary:disabled{opacity:.4;cursor:default}
.btn.plain{background:transparent;color:var(--accent-ink);padding:6px 0;font-size:13.5px}
.btn.danger{color:var(--bad)}
.seal{width:100%;display:flex;flex-direction:column;gap:6px}
.sig{font-family:var(--font-sign);font-size:30px;line-height:1.25;padding-bottom:2px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.line{font-size:12.5px;color:var(--fg-2)}
.line code{font-family:var(--font-mono);font-size:12px;letter-spacing:.04em;color:var(--fg);white-space:nowrap}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px}
.linkbox{width:100%;font:12px var(--font-mono);padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--field);color:var(--fg)}
.wrap>.btn{align-self:flex-start}

.field{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--fg-2)}
.text{font:inherit;font-size:16px;color:var(--fg);padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--field);width:100%}
.boards{display:flex;flex-direction:column}
.boards a{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;padding:11px 0;border-top:1px solid var(--line);color:var(--fg);text-decoration:none}
.boards li:first-child a{border-top:0}
.boards span{color:var(--fg-2);font-size:13px}
.muted{color:var(--fg-2)}
.foot{display:flex;flex-direction:column;align-items:flex-start;gap:6px;font-size:12.5px;color:var(--fg-2);max-width:72ch}
@media (max-width:560px){
  .wrap{padding:20px 16px 40px;gap:16px}
  .title{font-size:24px}
  textarea:not(.title),input{font-size:16px!important}
}
@media (prefers-reduced-motion:no-preference){.seg button,.check,.btn{transition:background-color .15s ease,opacity .15s ease}}
</style>

function copyLink(pid) {
  var link = linkFor(pid);
  if (!link) { S.err = 'The link is not ready yet. Wait a moment and try again.'; return; }
  copyText(link, function () {
    S.copied = pid; S.showLink = ''; render();
    setTimeout(function () { if (S.copied === pid) { S.copied = ''; render(); } }, 2500);
  }, function () { S.showLink = pid; S.focusNext = 'lk-' + pid; render(); });
}
function closest(el, sel) { while (el && el !== app && el.nodeType === 1) { if (el.matches(sel)) { return el; } el = el.parentNode; } return null; }
app.addEventListener('click', function (e) {
  var b = closest(e.target, 'button[data-act]'), a, id, t, nid;
  if (!b) { return; }
  a = b.getAttribute('data-act'); id = b.getAttribute('data-id');
  if (a === 'me') { S.me = id; S.confirm = null; }
  else if (a === 'add') { nid = 't' + rid(10); S.focusNext = 'tt-' + nid; store.setTask(nid, { pid: id, title: '', due: '', baseTitle: '', baseDue: '', addedBy: isCoord() ? 'c' : id, done: false, at: Date.now() }); }
  else if (a === 'done') { t = task(id); if (t) { store.patchTask(id, { done: !t.done }); } }
  else if (a === 'del') { store.delTask(id); }
  else if (a === 'withdraw') { store.delSig(id); }
  else if (a === 'addp') { nid = store.addPerson(); S.focusNext = 'pn-' + nid; }
  else if (a === 'rm') { S.confirm = id; }
  else if (a === 'rm-no') { S.confirm = null; }
  else if (a === 'rm-yes') { store.removePerson(id); S.confirm = null; }
  else if (a === 'link') { copyLink(id); }
  else if (a === 'okerr') { S.err = ''; }
  flush();
});
app.addEventListener('change', function (e) {
  var el = e.target, a = el.getAttribute('data-act'), id = el.getAttribute('data-id'), v = el.value, t, p, k;
  if (a === 'title' || a === 'due') {
    t = task(id); if (!t || (t[a] || '') === v) { return; }
    p = {}; p[a] = v; if (isCoord()) { p[a === 'title' ? 'baseTitle' : 'baseDue'] = v; }
    store.patchTask(id, p);
  } else if (a === 'ptitle') {
    if ((D().plan.title || '') === v) { return; }
    store.setTitle(v);
  } else if (a === 'pname' || a === 'prole') {
    p = person(id); k = a === 'pname' ? 'name' : 'role';
    if (!p || (p[k] || '') === v) { return; }
    t = {}; t[k] = v; store.setPerson(id, t);
  } else { return; }
  render();
});
app.addEventListener('input', function (e) {
  var el = e.target, k = el.getAttribute('data-draft'), b;
  if (el.tagName === 'TEXTAREA') { fit(el); }
  if (k) { S.draft[k] = el.value; if (k.indexOf('sn-') === 0 && el.form) { b = el.form.querySelector('button'); if (b) { b.disabled = el.value.trim().length < 2; } } }
});
app.addEventListener('focusin', function (e) { if (e.target.className === 'linkbox') { e.target.select(); } });
app.addEventListener('keydown', function (e) { if ((e.key === 'Enter' || e.keyCode === 13) && e.target.tagName === 'TEXTAREA') { e.preventDefault(); e.target.blur(); } });
app.addEventListener('submit', function (e) {
  var f = e.target, pid, name, title, cn;
  e.preventDefault();
  if (f.id === 'newboard') {
    if (S.busy) { return; }
    title = (S.draft['nb-title'] || '').trim(); cn = (S.draft['nb-coord'] == null ? 'Marco' : S.draft['nb-coord']).trim() || 'Marco';
    createBoard(title, cn);
    return;
  }
  pid = f.getAttribute('data-pid'); name = (S.draft['sn-' + pid] || '').trim();
  if (!pid || name.length < 2 || !complete(pid)) { return; }
  store.setSig(pid, { name: name, at: Date.now(), seal: sealOf(pid), n: tasksOf(pid).length });
  delete S.draft['sn-' + pid];
  flush();
});

/* ---------- start ---------- */
function route() {
  var h = location.hash.replace(/^#/, ''), m;
  if (/[?&]demo\b/.test(location.search)) { enterDemo(); paint(); return; }
  m = /^new\.([A-Za-z0-9]{16,64})$/.exec(h);
  if (m) { ls.set('code', m[1]); try { history.replaceState(null, '', location.pathname); } catch (e) {} h = ''; }
  m = /^([A-Za-z0-9]{20,40})\.(c|p[A-Za-z0-9]{1,12})\.([A-Za-z0-9]{20,40})$/.exec(h);
  if (m) { openBoard(m[1], m[2], m[3]); return; }
  if (h) { S.screen = 'board'; S.ready = true; S.fatal = fatalText({ code: 'bad-link' }); paint(); return; }
  S.screen = 'start'; paint();
}
window.addEventListener('hashchange', function () { location.reload(); });
route();
})();
</script>
